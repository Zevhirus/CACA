<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SIMARA Perumda Parkir Makassar Raya — Sistem Informasi Manajemen Arsip &amp; Surat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --c-primary:#0B3D63; --c-primary-dark:#072B47; --c-primary-tint:#E8EFF6;
    --c-accent:#C08A21; --c-accent-dark:#97690F; --c-accent-tint:#FBF2DD;
    --c-ink:#1A2530; --c-ink-muted:#5C6B7A; --c-surface:#FFFFFF; --c-bg:#F2F5F9;
    --c-border:#DDE5EE; --c-success:#1F7A4D; --c-success-tint:#E8F5EE;
    --c-danger:#B0291F; --c-danger-tint:#FBEAE8;
  }
  html,body{height:100%;}
  body{background:var(--c-bg); color:var(--c-ink); font-family:'Inter',system-ui,sans-serif;}
  .font-display{font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
  #printArea{display:none;}
  @media print {
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:18mm;}
    @page{size:A4; margin:0;}
  }
  .badge{display:inline-flex; align-items:center; gap:.4rem; padding:.25rem .7rem; border-radius:999px; font-size:.75rem; font-weight:600; white-space:nowrap;}
  input,select,textarea{font-family:inherit;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--c-primary); outline-offset:1px;}
  .timeline-line{position:absolute; left:15px; top:32px; bottom:-4px; width:2px; background:var(--c-border);}
</style>
</head>
<body class="font-body">
<div id="app"></div>
<div id="printArea"></div>

<script>
/* =====================================================================
   KONFIGURASI SUPABASE — hanya URL & PUBLISHABLE (anon) KEY di sini.
===================================================================== */
const SUPABASE_URL = "https://qfhksaccryqtnnozdnpd.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_DsQH3uoOdrZMBEnQLHiXfw_ePd_6CCZ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const LAMPIRAN_BUCKET = "lampiran-surat";
const ORG_NAME = "Perumda Parkir Makassar Raya";

/* ============================= DATA / KONSTAN ============================= */
// Peran yang MEMEGANG AKUN (dipakai di form login & panel admin)
const ROLES = [
  { id:'resepsionis', label:'Resepsionis', group:'Front Office', desc:'Mencatat surat masuk' },
  { id:'sekretaris', label:'Sekretaris', group:'Sekretariat', desc:'Tracking lokasi & menginput disposisi Direksi' },
  { id:'bagian_pengelolaan', label:'Bagian Pengelolaan', group:'Bagian', desc:'Tujuan akhir alur surat' },
  { id:'bagian_umum', label:'Bagian Umum', group:'Bagian', desc:'Tujuan akhir alur surat' },
  { id:'bagian_produksi', label:'Bagian Produksi', group:'Bagian', desc:'Tujuan akhir alur surat' },
  { id:'bagian_keuangan', label:'Bagian Keuangan', group:'Bagian', desc:'Tujuan akhir alur surat' },
  { id:'bagian_humas', label:'Bagian Humas', group:'Bagian', desc:'Tujuan akhir alur surat' },
];
const ROLE_MAP = Object.fromEntries(ROLES.map(r => [r.id, r]));
const BAGIAN_LIST = ROLES.filter(r => r.id.startsWith('bagian_'));

// Semua TAHAP yang bisa dilalui surat (termasuk tahap Direksi yang tidak
// punya akun login — disposisinya diinput oleh Sekretaris atas nama mereka).
const DIREKTUR_BIDANG = [
  { id:'dirum', label:'Direktur Umum' },
  { id:'dirops', label:'Direktur Operasional' },
  { id:'dirkeu', label:'Direktur Keuangan' },
];
const STAGE_META = {
  resepsionis:      { emoji:'⚪', label:'Diterima di Resepsionis',            c:'#5C6B7A', t:'#EEF1F4' },
  sekretaris:        { emoji:'🟣', label:'Dicatat oleh Sekretaris',            c:'#6A4FA0', t:'#F0EAF9' },
  dirut:             { emoji:'🟠', label:'Diserahkan ke Direktur Utama',       c:'#B5650C', t:'#FCEEDD' },
  dirum:             { emoji:'🟡', label:'Disposisi ke Direktur Umum',         c:'#A98307', t:'#FBF3D6' },
  dirops:            { emoji:'🟡', label:'Disposisi ke Direktur Operasional',  c:'#A98307', t:'#FBF3D6' },
  dirkeu:            { emoji:'🟡', label:'Disposisi ke Direktur Keuangan',     c:'#A98307', t:'#FBF3D6' },
  bagian_pengelolaan:{ emoji:'🔵', label:'Disposisi ke Bagian Pengelolaan',    c:'#1B5E8A', t:'#E9F2F8' },
  bagian_umum:       { emoji:'🔵', label:'Disposisi ke Bagian Umum',           c:'#1B5E8A', t:'#E9F2F8' },
  bagian_produksi:   { emoji:'🔵', label:'Disposisi ke Bagian Produksi',       c:'#1B5E8A', t:'#E9F2F8' },
  bagian_keuangan:   { emoji:'🔵', label:'Disposisi ke Bagian Keuangan',       c:'#1B5E8A', t:'#E9F2F8' },
  bagian_humas:      { emoji:'🔵', label:'Disposisi ke Bagian Humas',          c:'#1B5E8A', t:'#E9F2F8' },
  selesai:           { emoji:'🟢', label:'Diarsipkan',                        c:'#1F7A4D', t:'#E8F5EE' },
};
const SIFAT_OPT = [
  { id:'Biasa', color:'#5C6B7A', tint:'#EEF1F4' },
  { id:'Penting', color:'#A9700B', tint:'#FBF0DC' },
  { id:'Segera', color:'#B0291F', tint:'#FBEAE8' },
  { id:'Rahasia', color:'#0B3D63', tint:'#E8EFF6' },
];
function stageMeta(id){ return STAGE_META[id] || { emoji:'⚪', label:id||'-', c:'#5C6B7A', t:'#EEF1F4' }; }
function roleLabel(id){ if(!id) return 'Belum Ditetapkan'; return (ROLE_MAP[id] && ROLE_MAP[id].label) || stageMeta(id).label || id; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(d){ if(!d) return '-'; try{ return new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; } }
function fmtDateTime(d){ if(!d) return '-'; try{ return new Date(d).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})+' WIB'; }catch(e){ return d; } }
function genResi(){
  const d = new Date();
  const ymd = d.getFullYear().toString() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const rand = Array.from({length:5}, () => '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*34)]).join('');
  return 'SMR-' + ymd + '-' + rand;
}

/* ============================= STATE ============================= */
const State = {
  session: null, user: null, profile: null,
  authState: 'loading', // loading | login | no-role | ok
  authMode: 'signin',
  authError: '',
  publicMode: false,    // true = halaman Lacak Surat publik (tanpa login)
  trackResult: null, trackError: '', trackLoading: false,
  suratList: [], profiles: [], searchQ: '',
  view: 'dashboard',
  detailId: null,
  filterQ: '', filterSifat: '',
  toast: null,
};

/* ============================= APP LOGIC ============================= */
const App = {
  async init() {
    const params = new URLSearchParams(location.search);
    if (params.get('lacak') !== null) {
      State.publicMode = true;
      const resi = params.get('resi');
      render();
      if (resi) App.trackSurat(resi);
      return;
    }
    render();
    const { data: { session } } = await sb.auth.getSession();
    await App.handleSession(session);
    sb.auth.onAuthStateChange(async (_event, session) => { await App.handleSession(session); });
  },

  async handleSession(session) {
    State.session = session;
    State.user = session ? session.user : null;
    if (!session) { State.authState = 'login'; State.profile = null; render(); return; }
    await App.loadMyProfile();
    App.subscribeSurat();
    if (State.profile && State.profile.is_admin) App.subscribeProfiles();
  },
  async loadMyProfile() {
    const { data, error } = await sb.from('profiles').select('*').eq('id', State.user.id).maybeSingle();
    if (error) State.toast = { type:'error', msg:'Gagal memuat profil: ' + error.message };
    State.profile = data || null;
    State.authState = (State.profile && State.profile.role) ? 'ok' : 'no-role';
    render();
  },
  subscribeSurat() {
    sb.from('surat').select('*').order('created_at', { ascending:false }).then(({ data, error }) => {
      if (!error) { State.suratList = data || []; render(); }
    });
    sb.channel('surat-changes').on('postgres_changes', { event:'*', schema:'public', table:'surat' }, () => {
      sb.from('surat').select('*').order('created_at', { ascending:false }).then(({ data }) => { State.suratList = data || []; render(); });
    }).subscribe();
  },
  subscribeProfiles() {
    sb.from('profiles').select('*').order('created_at', { ascending:true }).then(({ data, error }) => {
      if (!error) { State.profiles = data || []; render(); }
    });
    sb.channel('profiles-changes').on('postgres_changes', { event:'*', schema:'public', table:'profiles' }, () => {
      sb.from('profiles').select('*').order('created_at', { ascending:true }).then(({ data }) => { State.profiles = data || []; render(); });
    }).subscribe();
  },

  /* --- Lacak Surat publik (tanpa login) --- */
  enterPublicTrack() { State.publicMode = true; State.trackResult = null; State.trackError = ''; render(); },
  exitPublicTrack() { State.publicMode = false; State.trackResult = null; State.trackError = ''; history.replaceState(null,'',location.pathname); render(); },
  async submitTrack(ev) {
    ev.preventDefault();
    const code = ev.target.resi.value.trim().toUpperCase();
    if (code) App.trackSurat(code);
  },
  async trackSurat(code) {
    State.trackLoading = true; State.trackError = ''; State.trackResult = null; render();
    const { data, error } = await sb.rpc('lacak_surat', { p_resi: code });
    State.trackLoading = false;
    if (error) { State.trackError = 'Terjadi kesalahan saat mencari data.'; render(); return; }
    if (!data || !data.length) { State.trackError = 'Nomor resi tidak ditemukan. Periksa kembali kode yang Anda masukkan.'; render(); return; }
    State.trackResult = data[0];
    render();
  },

  toggleAuthMode() { State.authMode = State.authMode === 'signin' ? 'signup' : 'signin'; State.authError=''; render(); },
  async submitAuth(ev) {
    ev.preventDefault();
    const f = ev.target;
    const email = f.email.value.trim();
    const password = f.password.value;
    State.authError = '';
    const btn = f.querySelector('button[type=submit]');
    btn.disabled = true;
    try {
      if (State.authMode === 'signin') {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const full_name = f.full_name.value.trim();
        const { error } = await sb.auth.signUp({ email, password, options: { data: { full_name } } });
        if (error) throw error;
        State.toast = { type:'success', msg:'Akun berhasil dibuat. Jika verifikasi email diaktifkan, cek email Anda sebelum masuk.' };
      }
    } catch (e) { State.authError = e.message || 'Terjadi kesalahan.'; }
    btn.disabled = false;
    render();
  },
  async logout() { await sb.auth.signOut(); State.view='dashboard'; },

  goTo(view, id) { State.view = view; State.detailId = id || null; window.scrollTo({top:0}); render(); },
  dismissToast() { State.toast = null; render(); },

  async submitSurat(ev) {
    ev.preventDefault();
    const f = ev.target;
    const nomor_surat = f.nomor_surat.value.trim();
    const tanggal_surat = f.tanggal_surat.value;
    const tanggal_terima = f.tanggal_terima.value || tanggal_surat;
    const pengirim = f.pengirim.value.trim();
    const sifat = f.sifat.value;
    const perihal = f.perihal.value.trim();
    const file = f.lampiran.files && f.lampiran.files[0];
    if (!nomor_surat || !tanggal_surat || !pengirim || !perihal) {
      State.toast = { type:'error', msg:'Mohon lengkapi seluruh bidang bertanda *.' }; render(); return;
    }
    const btn = f.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Menyimpan...';

    let lampiran_path = null, lampiran_name = null;
    if (file) {
      const path = State.user.id + '/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const { error: upErr } = await sb.storage.from(LAMPIRAN_BUCKET).upload(path, file);
      if (upErr) State.toast = { type:'error', msg:'Gagal mengunggah lampiran: ' + upErr.message + '. Surat tetap disimpan tanpa lampiran.' };
      else { lampiran_path = path; lampiran_name = file.name; }
    }

    const now = new Date().toISOString();
    const payload = {
      nomor_surat, tanggal_surat, tanggal_terima, pengirim, perihal, sifat: sifat || 'Biasa',
      nomor_resi: genResi(),
      lampiran_path, lampiran_name,
      current_stage: 'sekretaris', selesai: false,
      riwayat: [
        { waktu: now, posisi:'resepsionis', oleh:'Resepsionis', keterangan:'Surat masuk diterima dan dicatat oleh Resepsionis.' },
        { waktu: now, posisi:'sekretaris', oleh:'Resepsionis', keterangan:'Diteruskan ke Sekretaris untuk pencatatan lokasi fisik.' },
      ],
      disposisi: [],
      created_by: State.user.id,
    };
    const { data, error } = await sb.from('surat').insert(payload).select().single();
    if (error) {
      State.toast = { type:'error', msg:'Gagal menyimpan surat: ' + error.message };
      btn.disabled = false; btn.textContent = 'Simpan & Catat Surat Masuk';
      render();
    } else {
      State.toast = { type:'success', msg:'Surat ' + nomor_surat + ' berhasil dicatat. Nomor resi: ' + data.nomor_resi };
      App.goTo('dashboard');
    }
  },

  async _patchSurat(id, patchFn) {
    const s = State.suratList.find(x => x.id === id);
    if (!s) return;
    const patch = patchFn(s);
    const { error } = await sb.from('surat').update(patch).eq('id', id);
    if (error) { State.toast = { type:'error', msg:'Gagal memperbarui: ' + error.message }; render(); }
  },
  async forwardToDirut(id) {
    const now = new Date().toISOString();
    await App._patchSurat(id, s => ({
      current_stage:'dirut',
      riwayat: (s.riwayat||[]).concat([{ waktu:now, posisi:'dirut', oleh:'Sekretaris', keterangan:'Ringkasan surat diserahkan kepada Direktur Utama.' }]),
    }));
    State.toast = { type:'success', msg:'Surat diserahkan ke Direktur Utama.' }; render();
  },
  async updateLokasi(id, ev) {
    ev.preventDefault();
    const f = ev.target; const toStage = f.lokasi.value; const catatan = f.catatan.value.trim();
    const now = new Date().toISOString();
    await App._patchSurat(id, s => ({
      current_stage: toStage,
      riwayat: (s.riwayat||[]).concat([{ waktu:now, posisi:toStage, oleh:'Sekretaris', keterangan: catatan || ('Lokasi fisik surat diperbarui secara manual oleh Sekretaris menjadi ' + roleLabel(toStage) + '.') }]),
    }));
    State.toast = { type:'success', msg:'Lokasi surat diperbarui.' }; render();
  },
  async submitDisposisiDirut(id, ev) {
    ev.preventDefault();
    const f = ev.target; const tujuan = f.tujuan.value; const instruksi = f.instruksi.value.trim(); const catatan = f.catatan.value.trim();
    if (!tujuan || !instruksi) { State.toast = { type:'error', msg:'Pilih tujuan dan isi instruksi disposisi.' }; render(); return; }
    const now = new Date().toISOString();
    await App._patchSurat(id, s => ({
      current_stage: tujuan,
      disposisi: (s.disposisi||[]).concat([{ waktu:now, dari:'Direktur Utama', ke: roleLabel(tujuan), instruksi, catatan }]),
      riwayat: (s.riwayat||[]).concat([{ waktu:now, posisi:tujuan, oleh:'Sekretaris (a.n. Direktur Utama)', keterangan:'Didisposisikan oleh Direktur Utama kepada ' + roleLabel(tujuan) + '.' }]),
    }));
    State.toast = { type:'success', msg:'Disposisi dicatat, diteruskan ke ' + roleLabel(tujuan) + '.' }; render();
  },
  async submitDisposisiDirektur(id, fromStage, ev) {
    ev.preventDefault();
    const f = ev.target; const tujuan = f.tujuan.value; const instruksi = f.instruksi.value.trim(); const catatan = f.catatan.value.trim();
    if (!tujuan || !instruksi) { State.toast = { type:'error', msg:'Pilih tujuan dan isi instruksi disposisi.' }; render(); return; }
    const now = new Date().toISOString(); const fromLabel = roleLabel(fromStage);
    await App._patchSurat(id, s => ({
      current_stage: tujuan,
      disposisi: (s.disposisi||[]).concat([{ waktu:now, dari: fromLabel, ke: roleLabel(tujuan), instruksi, catatan }]),
      riwayat: (s.riwayat||[]).concat([{ waktu:now, posisi:tujuan, oleh:'Sekretaris (a.n. ' + fromLabel + ')', keterangan:'Didisposisikan oleh ' + fromLabel + ' kepada ' + roleLabel(tujuan) + '.' }]),
    }));
    State.toast = { type:'success', msg:'Disposisi dicatat, diteruskan ke ' + roleLabel(tujuan) + '.' }; render();
  },
  async selesaikanSurat(id, fromRole, ev) {
    ev.preventDefault();
    const f = ev.target; const catatan = f.catatan.value.trim();
    const now = new Date().toISOString(); const label = roleLabel(fromRole);
    await App._patchSurat(id, s => ({
      current_stage:'selesai', selesai:true,
      riwayat: (s.riwayat||[]).concat([{ waktu:now, posisi:'selesai', oleh:label, keterangan: catatan || ('Surat telah ditindaklanjuti dan diarsipkan oleh ' + label + '.') }]),
    }));
    State.toast = { type:'success', msg:'Surat diarsipkan.' }; render();
  },
  async printLembar(id) {
    const s = State.suratList.find(x => x.id === id);
    if (!s) return;
    document.getElementById('printArea').innerHTML = buildPrintHtml(s);
    setTimeout(() => window.print(), 50);
  },
  async openLampiran(path) {
    const { data, error } = await sb.storage.from(LAMPIRAN_BUCKET).createSignedUrl(path, 3600);
    if (error) { State.toast = { type:'error', msg:'Gagal membuka lampiran: ' + error.message }; render(); return; }
    window.open(data.signedUrl, '_blank');
  },

  async assignRole(userId, roleId) {
    const { error } = await sb.from('profiles').update({ role: roleId || null, updated_at: new Date().toISOString() }).eq('id', userId);
    State.toast = error ? { type:'error', msg:'Gagal menetapkan peran: ' + error.message } : { type:'success', msg:'Peran berhasil ditetapkan.' };
    render();
  },
  async toggleAdmin(userId, makeAdmin) {
    const { error } = await sb.from('profiles').update({ is_admin: makeAdmin }).eq('id', userId);
    State.toast = error ? { type:'error', msg:'Gagal mengubah status admin: ' + error.message } : { type:'success', msg:'Status admin diperbarui.' };
    render();
  },
};

/* ============================= KOMPONEN UI ============================= */
function Logo(size) {
  size = size || 40;
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="46" height="46" rx="11" fill="var(--c-primary)"/>
    <rect x="1" y="1" width="46" height="46" rx="11" stroke="var(--c-accent)" stroke-width="1.5"/>
    <path d="M16 34V14h8.2c4.5 0 7.3 2.6 7.3 6.6s-2.8 6.6-7.3 6.6h-4v6.8h-4.2Zm4.2-10.3h3.5c2.2 0 3.5-1.2 3.5-3.1s-1.3-3.1-3.5-3.1h-3.5v6.2Z" fill="white"/>
    <circle cx="34.5" cy="31.5" r="3" fill="var(--c-accent)"/></svg>`;
}
function sifatMeta(s){ return SIFAT_OPT.find(x=>x.id===s) || SIFAT_OPT[0]; }
function Badge(text,color,tint){ return `<span class="badge" style="color:${color};background:${tint};border:1px solid ${color}22;">${escapeHtml(text)}</span>`; }
function StageBadge(id){ const m = stageMeta(id); return `<span class="badge" style="color:${m.c};background:${m.t};border:1px solid ${m.c}22;">${m.emoji} ${escapeHtml(m.label)}</span>`; }
function Toast(){
  if (!State.toast) return '';
  const t = State.toast; const isErr = t.type === 'error';
  return `<div class="fixed top-4 right-4 z-50 max-w-sm rounded-lg shadow-lg border px-4 py-3 text-sm flex items-start gap-3"
       style="background:${isErr?'var(--c-danger-tint)':'var(--c-success-tint)'}; border-color:${isErr?'var(--c-danger)':'var(--c-success)'}33; color:${isErr?'var(--c-danger)':'var(--c-success)'};">
    <div class="flex-1">${escapeHtml(t.msg)}</div>
    <button onclick="App.dismissToast()" class="font-bold leading-none">&times;</button></div>`;
}
function BrandHeader() {
  return `<div class="flex flex-col items-center text-center mb-6">
    ${Logo(64)}
    <h1 class="font-display font-extrabold text-2xl mt-4" style="color:var(--c-primary);">SIMARA</h1>
    <p class="text-sm font-semibold" style="color:var(--c-primary);">${escapeHtml(ORG_NAME)}</p>
    <p class="text-xs mt-1" style="color:var(--c-ink-muted);">Sistem Informasi Manajemen Arsip &amp; Surat</p>
  </div>`;
}
function Shell(inner) {
  return `<div class="min-h-screen flex items-center justify-center px-4 py-10" style="background:var(--c-bg);">
    <div class="w-full max-w-md">${BrandHeader()}${inner}</div></div>`;
}

/* --- Lacak Surat (PUBLIK, tanpa login) --- */
function PublicTrackView() {
  let resultBlock = '';
  if (State.trackLoading) resultBlock = `<div class="text-sm text-center mt-4" style="color:var(--c-ink-muted);">Mencari...</div>`;

        <select name="tujuan" required class="w-full rounded-md border px-3 py-2 text-sm" style="border-color:var(--c-border);"><option value="">Pilih Bagian...</option>${BAGIAN_LIST.map(r=>`<option value="${r.id}">${r.label}</option>`).join('')}</select>
        <textarea name="instruksi" required rows="2" placeholder="Instruksi disposisi *" class="w-full rounded-md border px-3 py-2 text-sm" style="border-color:var(--c-border);"></textarea>
        <input name="catatan" placeholder="Catatan tambahan (opsional)" class="w-full rounded-md border px-3 py-2 text-sm" style="border-color:var(--c-border);">
        <button type="submit" class="text-sm font-semibold px-4 py-2 rounded-md" style="background:var(--c-primary); color:white;">🔵 Kirim Disposisi</button>
      </form></div>`);
    panels.push(`<div class="rounded-lg border p-4" style="background:var(--c-surface); border-color:var(--c-border);">
      <div class="font-semibold text-sm mb-2" style="color:var(--c-primary);">Perbarui Lokasi Fisik (Tracking Manual)</div>
      <form onsubmit="App.updateLokasi('${s.id}', event)" class="space-y-2">
        <select name="lokasi" class="w-full rounded-md border px-3 py-2 text-sm" style="border-color:var(--c-border);">
          ${['resepsionis','sekretaris','dirut',...DIREKTUR_BIDANG.map(r=>r.id),...BAGIAN_LIST.map(r=>r.id),'selesai'].map(id=>`<option value="${id}" ${s.current_stage===id?'selected':''}>${roleLabel(id)}</option>`).join('')}
        </select>
        <input name="catatan" placeholder="Catatan (opsional)" class="w-full rounded-md border px-3 py-2 text-sm" style="border-color:var(--c-border);">
        <button type="submit" class="text-sm font-semibold px-4 py-2 rounded-md" style="background:var(--c-accent); color:var(--c-primary-dark);">Perbarui Lokasi</button>
      </form></div>`);
  }
  if (BAGIAN_LIST.some(r=>r.id===role) && s.current_stage===role) panels.push(`<div class="rounded-lg border p-4" style="background:var(--c-surface); border-color:var(--c-border);">
      <div class="font-semibold text-sm mb-2" style="color:var(--c-primary);">Tindak Lanjut &amp; Pengarsipan</div>
      <form onsubmit="App.selesaikanSurat('${s.id}', '${role}', event)" class="space-y-2">
        <textarea name="catatan" rows="2" placeholder="Catatan tindak lanjut (opsional)" class="w-full rounded-md border px-3 py-2 text-sm" style="border-color:var(--c-border);"></textarea>
        <button type="submit" class="text-sm font-semibold px-4 py-2 rounded-md" style="background:var(--c-success); color:white;">🟢 Tandai Diarsipkan</button>
      </form></div>`);
  if (!panels.length) return `<div class="text-sm rounded-lg border p-4" style="border-color:var(--c-border); color:var(--c-ink-muted);">Tidak ada tindakan yang tersedia untuk peran Anda pada surat ini saat ini.</div>`;
  return panels.join('');
}
function DetailSurat() {
  const s = State.suratList.find(x => x.id === State.detailId);
  if (!s) return AksesDitolak();
  const sm = sifatMeta(s.sifat);
  return `<div class="max-w-5xl mx-auto px-4 py-6">
    <button onclick="App.goTo('dashboard')" class="text-sm mb-4" style="color:var(--c-ink-muted);">&larr; Kembali</button>
    <div class="flex items-start justify-between flex-wrap gap-3 mb-5">
      <div><div class="flex items-center gap-2 flex-wrap">
        <h1 class="font-display font-bold text-xl" style="color:var(--c-primary);">${escapeHtml(s.nomor_surat)}</h1>
        ${Badge(sm.id,sm.color,sm.tint)}${StageBadge(s.current_stage)}</div>
        <p class="text-sm mt-1" style="color:var(--c-ink-muted);">${escapeHtml(s.perihal)}</p>
        <p class="text-xs mt-1" style="color:var(--c-ink-muted);">Nomor Resi: <span class="font-mono font-semibold">${escapeHtml(s.nomor_resi||'-')}</span></p></div>
      <button onclick="App.printLembar('${s.id}')" class="text-sm font-semibold px-4 py-2 rounded-md border" style="border-color:var(--c-primary); color:var(--c-primary);">Cetak Lembar Disposisi</button>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-6">
        <div class="rounded-lg border p-4" style="background:var(--c-surface); border-color:var(--c-border);">
          <div class="font-semibold text-sm mb-3" style="color:var(--c-primary);">Informasi Surat</div>
          <dl class="grid grid-cols-2 gap-y-2.5 text-sm">
            <dt style="color:var(--c-ink-muted);">Tanggal Surat</dt><dd>${fmtDate(s.tanggal_surat)}</dd>
            <dt style="color:var(--c-ink-muted);">Tanggal Diterima</dt><dd>${fmtDate(s.tanggal_terima)}</dd>
            <dt style="color:var(--c-ink-muted);">Pengirim</dt><dd>${escapeHtml(s.pengirim)}</dd>
            <dt style="color:var(--c-ink-muted);">Sifat</dt><dd>${escapeHtml(s.sifat)}</dd>
            <dt class="col-span-2" style="color:var(--c-ink-muted);">Perihal</dt><dd class="col-span-2">${escapeHtml(s.perihal)}</dd>
            <dt style="color:var(--c-ink-muted);">Lampiran</dt><dd>${s.lampiran_path?`<button onclick="App.openLampiran('${s.lampiran_path}')" class="underline font-medium" style="color:var(--c-primary);">${escapeHtml(s.lampiran_name||'Lihat lampiran')}</button>`:'<span style="color:var(--c-ink-muted);">Tidak ada</span>'}</dd>
          </dl></div>
        <div class="rounded-lg border p-4" style="background:var(--c-surface); border-color:var(--c-border);">
          <div class="font-semibold text-sm mb-3" style="color:var(--c-primary);">Riwayat Disposisi</div>${DisposisiList(s.disposisi)}</div>
      </div>
      <div class="space-y-6">
        <div><div class="font-semibold text-sm mb-3" style="color:var(--c-primary);">Tindakan</div>${ActionPanel(s)}</div>
        <div><div class="font-semibold text-sm mb-3" style="color:var(--c-primary);">Timeline Pergerakan Surat</div>${Timeline(s.riwayat)}</div>
      </div>
    </div></div>`;
}
function AdminPanel() {
  if (!State.profile.is_admin) return AksesDitolak();
  const q = State.searchQ.toLowerCase();
  const rows = State.profiles.filter(p => !q || (p.full_name||'').toLowerCase().includes(q) || (p.email||'').toLowerCase().includes(q));
  return `<div class="max-w-3xl mx-auto px-4 py-6 space-y-4">
    <div><h1 class="font-display font-bold text-xl" style="color:var(--c-primary);">Kelola Pengguna &amp; Peran</h1>
    <p class="text-sm mt-0.5" style="color:var(--c-ink-muted);">Hanya akun Resepsionis, Sekretaris, dan tiap Bagian yang perlu ditetapkan perannya.</p></div>
    <input oninput="State.searchQ=this.value; App._render();" value="${escapeHtml(State.searchQ)}" placeholder="Cari nama / email..." class="w-full rounded-md border px-3 py-2 text-sm" style="border-color:var(--c-border);">
    <div class="rounded-lg border divide-y" style="background:var(--c-surface); border-color:var(--c-border);">
      ${rows.map(p => `<div class="flex flex-wrap items-center gap-2 p-3">
        <div class="flex-1 min-w-[160px]">
          <div class="text-sm font-medium">${escapeHtml(p.full_name || p.email)}</div>
          <div class="text-xs" style="color:var(--c-ink-muted);">${escapeHtml(p.email||'')}</div>
        </div>
        <select id="roleSel_${p.id}" class="rounded-md border px-2 py-1.5 text-xs" style="border-color:var(--c-border);">
          <option value="">— Belum ditetapkan —</option>
          ${ROLES.map(r => `<option value="${r.id}" ${p.role===r.id?'selected':''}>${r.label}</option>`).join('')}
        </select>
        <button onclick="App.assignRole('${p.id}', document.getElementById('roleSel_${p.id}').value)" class="text-xs font-semibold px-3 py-1.5 rounded-md" style="background:var(--c-primary); color:white;">Simpan</button>
        <label class="flex items-center gap-1 text-xs" style="color:var(--c-ink-muted);">
          <input type="checkbox" ${p.is_admin?'checked':''} onchange="App.toggleAdmin('${p.id}', this.checked)"> Admin
        </label>
      </div>`).join('') || `<div class="p-4 text-sm" style="color:var(--c-ink-muted);">Tidak ada akun yang cocok.</div>`}
    </div></div>`;
}
function buildPrintHtml(s) {
  const disposisiRows = (s.disposisi||[]).map(d=>`<tr><td style="border:1px solid #999;padding:6px 8px;">${fmtDateTime(d.waktu)}</td><td style="border:1px solid #999;padding:6px 8px;">${escapeHtml(d.dari)}</td><td style="border:1px solid #999;padding:6px 8px;">${escapeHtml(d.ke)}</td><td style="border:1px solid #999;padding:6px 8px;">${escapeHtml(d.instruksi)}${d.catatan?'<br><em>Catatan: '+escapeHtml(d.catatan)+'</em>':''}</td></tr>`).join('') || `<tr><td colspan="4" style="border:1px solid #999;padding:8px;text-align:center;color:#777;">Belum ada disposisi</td></tr>`;
  const riwayatRows = (s.riwayat||[]).slice().sort((a,b)=>new Date(a.waktu)-new Date(b.waktu)).map(r=>`<tr><td style="border:1px solid #999;padding:5px 8px;">${fmtDateTime(r.waktu)}</td><td style="border:1px solid #999;padding:5px 8px;">${escapeHtml(stageMeta(r.posisi).emoji + ' ' + roleLabel(r.posisi))}</td><td style="border:1px solid #999;padding:5px 8px;">${escapeHtml(r.keterangan)}</td></tr>`).join('');
  return `<div style="font-family:'Inter',Arial,sans-serif;color:#111;font-size:12px;">
    <div style="display:flex;align-items:center;gap:12px;border-bottom:3px solid #0B3D63;padding-bottom:10px;margin-bottom:14px;">
      <div style="width:44px;height:44px;border-radius:10px;background:#0B3D63;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;">PP</div>
      <div><div style="font-weight:800;font-size:15px;color:#0B3D63;">${escapeHtml(ORG_NAME.toUpperCase())}</div><div style="font-size:11px;color:#555;">SIMARA &mdash; Sistem Informasi Manajemen Arsip &amp; Surat</div></div>
      <div style="margin-left:auto;text-align:right;"><div style="font-weight:700;font-size:14px;">LEMBAR DISPOSISI</div><div style="font-size:11px;color:#555;">Dicetak: ${fmtDateTime(new Date().toISOString())}</div></div>
    </div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:14px;font-size:12px;">
      <tr><td style="width:140px;padding:4px 0;color:#555;">Nomor Surat</td><td style="padding:4px 0;font-weight:600;">: ${escapeHtml(s.nomor_surat)}</td><td style="width:140px;padding:4px 0;color:#555;">Nomor Resi</td><td style="padding:4px 0;font-weight:600;">: ${escapeHtml(s.nomor_resi||'-')}</td></tr>
      <tr><td style="padding:4px 0;color:#555;">Tanggal Surat</td><td style="padding:4px 0;">: ${fmtDate(s.tanggal_surat)}</td><td style="padding:4px 0;color:#555;">Sifat</td><td style="padding:4px 0;">: ${escapeHtml(s.sifat)}</td></tr>
      <tr><td style="padding:4px 0;color:#555;">Pengirim</td><td style="padding:4px 0;" colspan="3">: ${escapeHtml(s.pengirim)}</td></tr>
      <tr><td style="padding:4px 0;color:#555;vertical-align:top;">Perihal</td><td style="padding:4px 0;" colspan="3">: ${escapeHtml(s.perihal)}</td></tr>
      <tr><td style="padding:4px 0;color:#555;">Status Saat Ini</td><td style="padding:4px 0;font-weight:600;" colspan="3">: ${escapeHtml(stageMeta(s.current_stage).emoji + ' ' + stageMeta(s.current_stage).label)}</td></tr>
    </table>
    <div style="font-weight:700;margin-bottom:6px;">Instruksi Disposisi</div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:16px;"><thead><tr style="background:#E8EFF6;"><th style="border:1px solid #999;padding:6px 8px;text-align:left;">Waktu</th><th style="border:1px solid #999;padding:6px 8px;text-align:left;">Dari</th><th style="border:1px solid #999;padding:6px 8px;text-align:left;">Kepada</th><th style="border:1px solid #999;padding:6px 8px;text-align:left;">Instruksi / Catatan</th></tr></thead><tbody>${disposisiRows}</tbody></table>
    <div style="font-weight:700;margin-bottom:6px;">Riwayat Pergerakan Surat</div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:24px;"><thead><tr style="background:#E8EFF6;"><th style="border:1px solid #999;padding:5px 8px;text-align:left;">Waktu</th><th style="border:1px solid #999;padding:5px 8px;text-align:left;">Status</th><th style="border:1px solid #999;padding:5px 8px;text-align:left;">Keterangan</th></tr></thead><tbody>${riwayatRows}</tbody></table>
    <table style="width:100%;margin-top:30px;"><tr>
      <td style="width:33%;text-align:center;font-size:12px;"><div style="margin-bottom:50px;">Sekretaris</div><div style="border-top:1px solid #333;padding-top:4px;">(&nbsp;.....................&nbsp;)</div></td>
      <td style="width:33%;text-align:center;font-size:12px;"><div style="margin-bottom:50px;">Direktur Utama</div><div style="border-top:1px solid #333;padding-top:4px;">(&nbsp;.....................&nbsp;)</div></td>
      <td style="width:33%;text-align:center;font-size:12px;"><div style="margin-bottom:50px;">Bagian Terkait</div><div style="border-top:1px solid #333;padding-top:4px;">(&nbsp;.....................&nbsp;)</div></td>
    </tr></table></div>`;
}

/* ============================= MASTER RENDER ============================= */
function render(){ App._render(); }
App._render = function() {
  const el = document.getElementById('app');
  if (State.publicMode) { el.innerHTML = PublicTrackView() + Toast(); return; }
  if (State.authState === 'loading') { el.innerHTML = Shell('<div class="text-sm text-center" style="color:var(--c-ink-muted);">Memuat...</div>') + Toast(); return; }
  if (State.authState === 'login') { el.innerHTML = LoginView() + Toast(); return; }
  if (State.authState === 'no-role') { el.innerHTML = NoRoleView() + Toast(); return; }
  let body = '';
  if (State.view === 'dashboard') body = Dashboard();
  else if (State.view === 'semua') body = SemuaSurat();
  else if (State.view === 'input') body = InputSurat();
  else if (State.view === 'detail') body = DetailSurat();
  else if (State.view === 'admin') body = AdminPanel();
  else body = Dashboard();
  el.innerHTML = Navbar() + TabBar() + `<main>${body}</main>` + Toast();
};

App.init();
</script>
</body>
</html>
